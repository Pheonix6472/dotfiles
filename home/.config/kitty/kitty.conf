# Fonts
font_family JetBrains Mono
font_size 10.0

# Font fallbacks
symbol_map U+1F300-U+1FAFF Noto Color Emoji
symbol_map U+2600-U+27BF Noto Color Emoji
symbol_map U+2300-U+23FF Noto Sans Symbols 2
symbol_map U+2000-U+2BFF Noto Sans Symbols 2
symbol_map U+3000-U+30FF Noto Sans CJK JP
symbol_map U+31F0-U+31FF Noto Sans CJK JP
symbol_map U+3400-U+4DBF Noto Sans CJK JP
symbol_map U+4E00-U+9FFF Noto Sans CJK JP
symbol_map U+F900-U+FAFF Noto Sans CJK JP
symbol_map U+FF00-U+FFEF Noto Sans CJK JP

# Color Scheme
background_opacity 0.4
background_blur 10
